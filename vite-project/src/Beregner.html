<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Beregner</title>
  <link rel="stylesheet" href="style2.css">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
<div class="main-container">
  <div class="left-section">
    <img id="packwise-image" src="../src/Packwise.png" alt="Packwise" /> <br>
    <form id="produkt-form">
      <div id="produkt-container" class="produkt-container">
        <div class="produkt" data-editing="false">
          <button type="button" class="delete-button" onclick="sletProdukt(this)">X</button>
          <button type="button" class="reset-button" onclick="nulstilProdukt(this)">
            <img src="View-refresh.svg.png" alt="Nulstil">
          </button>
          <label for="produkt-valg-1">Vælg produkt:</label>
          <select id="produkt-valg-1" class="produkt-valg" onchange="nulstilOgOpdater(this)">
            <option value="">Vælg et produkt</option>
          </select>
          <label for="antal-1" class="antal-label" style="display: none;">Antal:</label>
          <input type="number" id="antal-1" class="antal" min="0" value="0" onblur="opdaterVærdier()" required style="display: none;" placeholder="Indtast antal">
          <label for="vægt-1" class="vægt-label" style="display: none;">Vægt (g):</label>
          <input type="number" id="vægt-1" class="vægt" min="0" step="0.001" value="0" onblur="opdaterVærdier()" required readonly style="display: none;">
          <img class="produkt-gif" src="" alt="Produkt GIF" style="width: auto; height: auto; display: none;">
          <button type="button" id="edit-product-button" class="edit-save-button" onclick="toggleEditSave(this)" style="display: none;">Rediger dine produktdata</button>
          <div id="materiale-info-1" class="materiale-info">
            <label>Plastik (g): <input type="number" class="plastik-gram" onblur="opdaterVærdier()"></label><br>
            <label>Metal (g): <input type="number" class="metal-gram" onblur="opdaterVærdier()"></label><br>
            <label>Glas (g): <input type="number" class="glas-gram" onblur="opdaterVærdier()"></label><br>
            <label>Træ (g): <input type="number" class="træ-gram" onblur="opdaterVærdier()"></label><br>
            <label>Pris for Plastik (DKK): <input type="number" class="pris-plastik" readonly></label><br>
            <label>Pris for Metal (DKK): <input type="number" class="pris-metal" readonly></label><br>
            <label>Pris for Glas (DKK): <input type="number" class="pris-glas" readonly></label><br>
            <label>Pris for Træ (DKK): <input type="number" class="pris-træ" readonly></label><br>
            <label>Total Pris (DKK): <input type="number" class="total-pris" readonly></label>
          </div>
        </div>
      </div>
      <div id="add-product-container">
        <button id="add-product-button" type="button" onclick="tilføjProdukt()">Tilføj Produkt</button>
      </div>
    </form>
  </div>

  <div class="right-section">
    <form>
      <h2>Samlet Pris (DKK):</h2>
      <input type="number" id="samlet-pris" min="0" readonly>

      <h2>Antal Produkter:</h2>
      <input type="number" id="samlet-antal" min="0" readonly>
      <h2>Din e-mail:</h2>
      <input type="email" id="user-email" required>

      <button type="button" id="send-result-button" onclick="sendEmail()">Send beregning</button>
    </form>
  </div>
</div>

<div id="custom-alert" class="modal">
  <div class="modal-content">
    <span class="close-button" onclick="closeAlert()">&times;</span>
    <p id="alert-message">This is a custom alert message.</p>
  </div>
</div>

<script>
  let produktCount = 1;
  let materialData = {}; // Gemmer materiale data fra CSV
  let materialPrices = {}; // Gemmer materialepriser fra CSV
  let availableProducts = []; // Liste over produkter fra CSV

  // Indlæs CSV data
  async function loadMaterialData() {
    try {
      // Indlæs produktdata
      const response = await fetch('material_data.csv');
      if (!response.ok) throw new Error('Kunne ikke indlæse produktdata CSV fil');
      const csvText = await response.text();
      const lines = csvText.split('\n').filter(line => line.trim() !== '');

      // Fjern header og tomme linjer
      const headers = lines[0].split(',').map(h => h.trim());
      for (let i = 1; i < lines.length; i++) {
        const values = lines[i].split(',');
        const product = {
          id: values[0].trim(),
          name: values[1].trim(),
          plastik: parseFloat(values[2]) || 0,
          metal: parseFloat(values[3]) || 0,
          glas: parseFloat(values[4]) || 0,
          træ: parseFloat(values[5]) || 0
        };
        materialData[product.id] = product;
      }

      // Opret liste over tilgængelige produkter
      availableProducts = Object.keys(materialData).map(id => {
        return {
          id: id,
          name: materialData[id].name || id // Brug navn eller id hvis navn mangler
        };
      });

      // Sorter produkter alfabetisk efter navn
      availableProducts.sort((a, b) => a.name.localeCompare(b.name));

      // Indlæs prisdata
      const priceResponse = await fetch('material_prices.csv');
      if (!priceResponse.ok) throw new Error('Kunne ikke indlæse prisdata CSV fil');
      const priceCsvText = await priceResponse.text();
      const priceLines = priceCsvText.split('\n').filter(line => line.trim() !== '');

      // Parse prisdata
      for (let i = 1; i < priceLines.length; i++) {
        const [material, pris] = priceLines[i].split(',');
        if (material && pris) {
          materialPrices[material.trim()] = parseFloat(pris);
        }
      }

      console.log('Data indlæst succesfuldt:', {materialData, materialPrices, availableProducts});

      // Opdater alle dropdowns efter data er indlæst
      updateAllProductDropdowns();
    } catch (error) {
      console.error('Fejl ved indlæsning af data:', error);
      showAlert("Materiale data kunne ikke indlæses fuldt ud. Bruger begrænset datasæt.");
    }
  }

  // Opdater en enkelt dropdown med produkter fra CSV
  function updateProductDropdown(dropdown) {
    const currentValue = dropdown.value; // Gem nuværende valg

    // Ryd dropdown
    dropdown.innerHTML = '<option value="">Vælg et produkt</option>';

    // Tilføj produkter fra CSV
    availableProducts.forEach(product => {
      const option = document.createElement('option');
      option.value = product.id;
      option.textContent = product.name;
      dropdown.appendChild(option);
    });

    // Gendan tidligere valg hvis det stadig findes
    if (currentValue && availableProducts.some(p => p.id === currentValue)) {
      dropdown.value = currentValue;
    }
  }

  // Opdater alle produkt dropdowns
  function updateAllProductDropdowns() {
    const dropdowns = document.querySelectorAll('.produkt-valg');
    dropdowns.forEach(dropdown => {
      updateProductDropdown(dropdown);
    });
  }

  function tilføjProdukt() {
    produktCount++;
    const container = document.getElementById("produkt-container");

    const produktDiv = document.createElement("div");
    produktDiv.classList.add("produkt");
    produktDiv.setAttribute("data-editing", "false");

    produktDiv.innerHTML = `
      <button type="button" class="delete-button" onclick="sletProdukt(this)">X</button>
      <button type="button" class="reset-button" onclick="nulstilProdukt(this)">
        <img src="View-refresh.svg.png" alt="Nulstil">
      </button>
      <label for="produkt-valg-${produktCount}">Vælg produkt:</label>
      <select id="produkt-valg-${produktCount}" class="produkt-valg" onchange="nulstilOgOpdater(this)">
        <option value="">Vælg et produkt</option>
      </select>
      <label for="antal-${produktCount}" class="antal-label" style="display: none;">Antal:</label>
      <input type="number" id="antal-${produktCount}" class="antal" min="0" value="0" onblur="opdaterVærdier()" required style="display: none;" placeholder="Indtast antal">
      <label for="vægt-${produktCount}" class="vægt-label" style="display: none;">Vægt (g):</label>
      <input type="number" id="vægt-${produktCount}" class="vægt" min="0" step="0.001" value="0" onblur="opdaterVærdier()" required readonly style="display: none;">
      <img class="produkt-gif" src="" alt="Produkt GIF" style="width: 100px; height: auto; display: none;">
      <button type="button" id="edit-product-button" class="edit-save-button" onclick="toggleEditSave(this)" style="display: none;">Rediger dine produktdata</button>
      <div id="materiale-info-${produktCount}" class="materiale-info">
        <label>Plastik (g): <input type="number" class="plastik-gram" onblur="opdaterVærdier()"></label><br>
        <label>Metal (g): <input type="number" class="metal-gram" onblur="opdaterVærdier()"></label><br>
        <label>Glas (g): <input type="number" class="glas-gram" onblur="opdaterVærdier()"></label><br>
        <label>Træ (g): <input type="number" class="træ-gram" onblur="opdaterVærdier()"></label><br>
        <label>Pris for Plastik (DKK): <input type="number" class="pris-plastik" readonly></label><br>
        <label>Pris for Metal (DKK): <input type="number" class="pris-metal" readonly></label><br>
        <label>Pris for Glas (DKK): <input type="number" class="pris-glas" readonly></label><br>
        <label>Pris for Træ (DKK): <input type="number" class="pris-træ" readonly></label><br>
        <label>Total Pris (DKK): <input type="number" class="total-pris" readonly></label>
      </div>
    `;

    container.appendChild(produktDiv);

    // Opdater dropdown for det nye produkt
    const newDropdown = document.getElementById(`produkt-valg-${produktCount}`);
    updateProductDropdown(newDropdown);
  }

  // Resten af dine funktioner forbliver uændret
  function sletProdukt(button) {
    const produktDiv = button.parentElement;
    produktDiv.remove();
    opdaterVærdier();
  }

  function nulstilProdukt(button) {
    const produktDiv = button.parentElement;
    produktDiv.querySelector(".produkt-valg").value = "";
    produktDiv.querySelector(".antal").value = 0;
    produktDiv.querySelector(".vægt").value = 0;
    produktDiv.querySelector(".produkt-gif").style.display = "none";
    produktDiv.querySelector(".edit-save-button").textContent = "Rediger dine produktdata";
    produktDiv.querySelector(".materiale-info").style.display = "none";
    produktDiv.querySelectorAll("input[type='number']").forEach(input => input.value = "");
    produktDiv.setAttribute("data-editing", "false");
    opdaterVærdier();
  }

  function nulstilOgOpdater(selectElement) {
    const produktDiv = selectElement.closest(".produkt");
    produktDiv.querySelector(".antal").value = 0;
    produktDiv.querySelector(".vægt").value = 0;
    produktDiv.querySelector(".produkt-gif").style.display = "none";
    produktDiv.querySelector(".edit-save-button").textContent = "Rediger dine produktdata";
    produktDiv.querySelector(".materiale-info").style.display = "none";
    produktDiv.querySelectorAll("input[type='number']").forEach(input => input.value = "");
    produktDiv.setAttribute("data-editing", "false");
    opdaterVærdier();
  }

  function toggleEditSave(button) {
    const produktDiv = button.parentElement;
    const materialeInfo = produktDiv.querySelector(".materiale-info");
    const produktGif = produktDiv.querySelector(".produkt-gif");
    const isEditing = produktDiv.getAttribute("data-editing") === "true";

    if (isEditing) {
      produktDiv.setAttribute("data-editing", "false");
      button.textContent = "Rediger dine produktdata";
      materialeInfo.style.display = "none";
      produktGif.style.display = "block";
    } else {
      produktDiv.setAttribute("data-editing", "true");
      button.textContent = "Gem";
      materialeInfo.style.display = "block";
      produktGif.style.display = "none";
    }
    opdaterVærdier();
  }

  function opdaterVærdier() {
    const produkter = document.querySelectorAll(".produkt");
    let samletPris = 0;
    let samletAntal = 0;

    produkter.forEach((produktDiv, index) => {
      const produktValg = produktDiv.querySelector(".produkt-valg").value;
      const antalLabel = produktDiv.querySelector(".antal-label");
      const antalInput = produktDiv.querySelector(".antal");
      const vægtLabel = produktDiv.querySelector(".vægt-label");
      const vægtInput = produktDiv.querySelector(".vægt");
      const produktGif = produktDiv.querySelector(".produkt-gif");
      const editSaveButton = produktDiv.querySelector(".edit-save-button");
      const materialeInfo = produktDiv.querySelector(".materiale-info");
      const isEditing = produktDiv.getAttribute("data-editing") === "true";

      if (produktValg) {
        antalLabel.style.display = "block";
        antalInput.style.display = "block";
        vægtLabel.style.display = "block";
        vægtInput.style.display = "block";
        produktGif.src = `produkter/${produktValg}.gif`;
        produktGif.style.display = isEditing ? "none" : "block";
        produktGif.style.width = "300px";
        produktGif.style.height = "auto";
        editSaveButton.textContent = isEditing ? "Gem" : "Rediger dine produktdata";
        materialeInfo.style.display = isEditing ? "block" : "none";
        editSaveButton.style.display = "block";

        // Hent materialevægte fra CSV-data
        const productData = materialData[produktValg] || {};
        const defaultPlastik = productData.plastik || 0;
        const defaultMetal = productData.metal || 0;
        const defaultGlas = productData.glas || 0;
        const defaultTræ = productData.træ || 0;

        // Sæt standardværdier hvis felterne er tomme
        if (!produktDiv.querySelector(".plastik-gram").value && defaultPlastik !== 0) {
          produktDiv.querySelector(".plastik-gram").value = defaultPlastik;
        }
        if (!produktDiv.querySelector(".metal-gram").value && defaultMetal !== 0) {
          produktDiv.querySelector(".metal-gram").value = defaultMetal;
        }
        if (!produktDiv.querySelector(".glas-gram").value && defaultGlas !== 0) {
          produktDiv.querySelector(".glas-gram").value = defaultGlas;
        }
        if (!produktDiv.querySelector(".træ-gram").value && defaultTræ !== 0) {
          produktDiv.querySelector(".træ-gram").value = defaultTræ;
        }
      }

      // Beregn priser baseret på indtastede vægte
      let plastikGram = parseFloat(produktDiv.querySelector(".plastik-gram").value) || 0;
      let metalGram = parseFloat(produktDiv.querySelector(".metal-gram").value) || 0;
      let glasGram = parseFloat(produktDiv.querySelector(".glas-gram").value) || 0;
      let træGram = parseFloat(produktDiv.querySelector(".træ-gram").value) || 0;
      const antal = parseInt(antalInput.value) || 0;

      const prisPlastik = (plastikGram * (materialPrices.plastik || 0.004) * antal).toFixed(2);
      const prisMetal = (metalGram * (materialPrices.metal || 0.001) * antal).toFixed(2);
      const prisGlas = (glasGram * (materialPrices.glas || 0.002) * antal).toFixed(2);
      const prisTræ = (træGram * (materialPrices.træ || 0.00066) * antal).toFixed(2);
      const totalPris = (parseFloat(prisPlastik) + parseFloat(prisMetal) + parseFloat(prisGlas) + parseFloat(prisTræ)).toFixed(2);

      produktDiv.querySelector(".pris-plastik").value = prisPlastik;
      produktDiv.querySelector(".pris-metal").value = prisMetal;
      produktDiv.querySelector(".pris-glas").value = prisGlas;
      produktDiv.querySelector(".pris-træ").value = prisTræ;
      produktDiv.querySelector(".total-pris").value = totalPris;

      const totalVægt = plastikGram + metalGram + glasGram + træGram;
      vægtInput.value = totalVægt.toFixed(3);

      samletPris += parseFloat(totalPris);
      samletAntal += antal;
    });

    document.getElementById("samlet-pris").value = samletPris.toFixed(2);
    document.getElementById("samlet-antal").value = samletAntal || 0;
  }

  function sendEmail() {
    const userEmail = document.getElementById("user-email").value;
    if (!userEmail) {
      showAlert("Indtast din e-mailadresse.");
      return;
    }

    let produkter = [];
    let produktDetaljer = [];

    document.querySelectorAll(".produkt").forEach(produktDiv => {
      const produktNavn = produktDiv.querySelector(".produkt-valg").value;
      const antal = produktDiv.querySelector(".antal").value;
      const vægt = produktDiv.querySelector(".vægt").value;
      const pris = produktDiv.querySelector(".total-pris").value;
      const plastikGram = produktDiv.querySelector(".plastik-gram").value || 0;
      const metalGram = produktDiv.querySelector(".metal-gram").value || 0;
      const glasGram = produktDiv.querySelector(".glas-gram").value || 0;
      const træGram = produktDiv.querySelector(".træ-gram").value || 0;
      const prisPlastik = produktDiv.querySelector(".pris-plastik").value || 0;
      const prisMetal = produktDiv.querySelector(".pris-metal").value || 0;
      const prisGlas = produktDiv.querySelector(".pris-glas").value || 0;
      const prisTræ = produktDiv.querySelector(".pris-træ").value || 0;

      if (produktNavn) {
        produkter.push(`${antal}x ${produktNavn} - Vægt: ${vægt}g - Pris: ${pris}DKK`);
        produktDetaljer.push(
                `${antal}x ${produktNavn}:\n` +
                `  - Plastik: ${plastikGram}g (${prisPlastik} DKK)\n` +
                `  - Metal: ${metalGram}g (${prisMetal} DKK)\n` +
                `  - Glas: ${glasGram}g (${prisGlas} DKK)\n` +
                `  - Træ: ${træGram}g (${prisTræ} DKK)\n`
        );
      }
    });

    const samletPris = document.getElementById("samlet-pris").value;
    const samletAntal = document.getElementById("samlet-antal").value;

    const signature_html = `
      <div style="font-family: Arial, sans-serif; color: #333; margin-top: 30px; padding-top: 15px; border-top: 1px solid #e0e0e0;">
        <p style="margin: 5px 0;"><strong>Med venlig hilsen</strong></p>
        <p style="margin: 5px 0; font-weight: bold;">Peter Odefey</p>
        <p style="margin: 5px 0;">+45 42 39 69 66 | <a href="mailto:po@packwise.dk" style="color: #0066cc; text-decoration: none;">po@packwise.dk</a></p>
        <p style="margin: 5px 0;"><a href="https://www.packwise.dk/" style="color: #0066cc; text-decoration: none;">www.packwise.dk</a></p>
        <div style="margin-top: 10px;">
          <strong>PACKWISE</strong>
        </div>
        <p style="margin-top: 15px; font-size: 12px; color: #666;">
          PACKWISE Int. ApS<br>
          Ehlersvej 11, DK-2900 Hellerup<br>
          <em>Please consider the environment before printing this email.</em>
        </p>
      </div>
    `;

    const emailData = {
      user_email: userEmail,
      product_list: produkter.join("\n"),
      product_details: produktDetaljer.join("\n"),
      total_price: samletPris,
      total_items: samletAntal,
      signature_html: signature_html
    };

    emailjs.send("service_0ymhfiq", "template_008il29", emailData)
            .then(response => {
              showAlert("E-mail sendt succesfuldt!");
              console.log("EmailJS Response:", response);
            })
            .catch(error => {
              showAlert("Fejl ved afsendelse af e-mail.");
              console.error("EmailJS Error:", error);
            });
  }

  function showAlert(message) {
    const modal = document.getElementById("custom-alert");
    const alertMessage = document.getElementById("alert-message");
    alertMessage.textContent = message;
    modal.style.display = "block";
  }

  function closeAlert() {
    const modal = document.getElementById("custom-alert");
    modal.style.display = "none";
  }

  // Initialisering
  document.addEventListener("DOMContentLoaded", function() {
    emailjs.init("MgTN6UfGPPCv0OA2B");
    loadMaterialData();

    document.getElementById("produkt-form").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        opdaterVærdier();
      }
    });
  });
</script>
</body>
</html>
