<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Beregner</title>
  <link rel="stylesheet" href="style2.css">
</head>
<body>
<form id="produkt-form">
  <div id="produkt-container">
    <div class="produkt">
      <label for="produkt-valg-1">Vælg produkt:</label>
      <select id="produkt-valg-1" class="produkt-valg" onchange="opdaterVærdier()">
        <option value="">Vælg et produkt</option>
        <option value="pumpe">Pumpe</option>
        <option value="airless-dispenser">Airless dispenser</option>
        <option value="bambus">Bambus</option>
        <option value="creme-krukke">Creme krukke</option>
        <option value="creme-pumpe">Creme pumpe</option>
        <option value="deo-roll-on">Deo roll-on</option>
        <option value="emballage-sæt">Emballage sæt</option>
        <option value="glasemballage">Glasemballage</option>
        <option value="kapsler">Kapsler</option>
        <option value="lotion-pumpe">Lotion pumpe</option>
        <option value="make-up-emballage">Make-up emballage</option>
        <option value="make-up-fjerner-pumpe">Make-up fjerner pumpe</option>
        <option value="mist-sprayer">Mist sprayer</option>
        <option value="parfume-forstøver">Parfume forstøver</option>
        <option value="pet-flaske">PET flaske</option>
        <option value="pet-krukke">PET krukke</option>
        <option value="pharma-emballage">Pharma emballage</option>
        <option value="pipette-flaske">Pipette flaske</option>
        <option value="pp-pe-flaske">PP & PE flaske</option>
        <option value="premium-emballage">Premium emballage</option>
        <option value="skumpumpe">Skumpumpe</option>
        <option value="spande">Spande</option>
        <option value="sprayflaske">Sprayflaske</option>
        <option value="trigger-sprayer">Trigger sprayer</option>
        <option value="tube">Tube</option>
      </select>
      <br>
      <label for="antal-1">Antal:</label>
      <input type="number" id="antal-1" class="antal" min="1" value="1" onchange="opdaterVærdier()" required>
      <br>
      <img class="produkt-gif" src="" alt="Produkt GIF" style="width: 100px; height: auto; display: none;">
      <div id="materiale-info-1" class="materiale-info" style="display: none;">
        <span>1 produkt = 10g</span><br>
        <label>PP: <input type="number" class="pp" value="73.02" onchange="opdaterVærdier()"></label><br>
        <label>PE: <input type="number" class="pe" value="15.07" onchange="opdaterVærdier()"></label><br>
        <label>Metal: <input type="number" class="metal" value="11.32" onchange="opdaterVærdier()"></label><br>
        <label>Glas: <input type="number" class="glas" value="0.58" onchange="opdaterVærdier()"></label>
        <br>
        <label>Pris for PP (kr): <input type="number" class="pris-pp" readonly></label><br>
        <label>Pris for PE (kr): <input type="number" class="pris-pe" readonly></label><br>
        <label>Pris for Metal (kr): <input type="number" class="pris-metal" readonly></label><br>
        <label>Pris for Glas (kr): <input type="number" class="pris-glas" readonly></label>
      </div>
    </div>
  </div>
  <button type="button" onclick="tilføjProdukt()">Tilføj Produkt</button>
  <br><br>
  <label for="samlet-pris">Samlet Pris (kr):</label>
  <input type="number" id="samlet-pris" min="0" readonly>
  <br><br>
</form>

<script>
  let produktCount = 1;

  const priser = {
    pumpe: { vægt: 0.01, pp: 73.02, pe: 15.07, metal: 11.32, glas: 0.58 },
    "airless-dispenser": { vægt: 0.01, pp: 73.02, pe: 15.07, metal: 11.32, glas: 0.58 },
    bambus: { vægt: 0.02, pp: 60.00, pe: 20.00, metal: 15.00, glas: 5.00 },
    "creme-krukke": { vægt: 0.03, pp: 50.00, pe: 25.00, metal: 20.00, glas: 5.00 },
    // Tilføj flere produkter her
  };

  const bearbejdningsPriser = {
    pp: 0.04,
    pe: 0.04,
    metal: 0.01,
    glas: 0.02
  };

  function tilføjProdukt() {
    produktCount++;
    const container = document.getElementById("produkt-container");

    const produktDiv = document.createElement("div");
    produktDiv.classList.add("produkt");
    produktDiv.innerHTML = `
      <label for="produkt-valg-${produktCount}">Vælg produkt:</label>
      <select id="produkt-valg-${produktCount}" class="produkt-valg" onchange="opdaterVærdier()">
        <option value="">Vælg et produkt</option>
        <option value="pumpe">Pumpe</option>
        <option value="airless-dispenser">Airless dispenser</option>
        <option value="bambus">Bambus</option>
        <option value="creme-krukke">Creme krukke</option>
        <option value="creme-pumpe">Creme pumpe</option>
        <option value="deo-roll-on">Deo roll-on</option>
        <option value="emballage-sæt">Emballage sæt</option>
        <option value="glasemballage">Glasemballage</option>
        <option value="kapsler">Kapsler</option>
        <option value="lotion-pumpe">Lotion pumpe</option>
        <option value="make-up-emballage">Make-up emballage</option>
        <option value="make-up-fjerner-pumpe">Make-up fjerner pumpe</option>
        <option value="mist-sprayer">Mist sprayer</option>
        <option value="parfume-forstøver">Parfume forstøver</option>
        <option value="pet-flaske">PET flaske</option>
        <option value="pet-krukke">PET krukke</option>
        <option value="pharma-emballage">Pharma emballage</option>
        <option value="pipette-flaske">Pipette flaske</option>
        <option value="pp-pe-flaske">PP & PE flaske</option>
        <option value="premium-emballage">Premium emballage</option>
        <option value="skumpumpe">Skumpumpe</option>
        <option value="spande">Spande</option>
        <option value="sprayflaske">Sprayflaske</option>
        <option value="trigger-sprayer">Trigger sprayer</option>
        <option value="tube">Tube</option>
      </select>
      <br>
      <label for="antal-${produktCount}">Antal:</label>
      <input type="number" id="antal-${produktCount}" class="antal" min="1" value="1" onchange="opdaterVærdier()" required>
      <br>
      <img class="produkt-gif" src="" alt="Produkt GIF" style="width: 100px; height: auto; display: none;">
      <div id="materiale-info-${produktCount}" class="materiale-info" style="display: none;">
        <span>1 produkt = 10g</span><br>
        <label>PP: <input type="number" class="pp" value="73.02" onchange="opdaterVærdier()"></label><br>
        <label>PE: <input type="number" class="pe" value="15.07" onchange="opdaterVærdier()"></label><br>
        <label>Metal: <input type="number" class="metal" value="11.32" onchange="opdaterVærdier()"></label><br>
        <label>Glas: <input type="number" class="glas" value="0.58" onchange="opdaterVærdier()"></label>
        <br>
        <label>Pris for PP (kr): <input type="number" class="pris-pp" readonly></label><br>
        <label>Pris for PE (kr): <input type="number" class="pris-pe" readonly></label><br>
        <label>Pris for Metal (kr): <input type="number" class="pris-metal" readonly></label><br>
        <label>Pris for Glas (kr): <input type="number" class="pris-glas" readonly></label>
      </div>
    `;
    container.appendChild(produktDiv);
  }

  function opdaterVærdier() {
    const produkter = document.querySelectorAll(".produkt");
    let samletPris = 0;

    produkter.forEach((produktDiv, index) => {
      const produktValg = produktDiv.querySelector(".produkt-valg").value;
      const antal = parseInt(produktDiv.querySelector(".antal").value);
      const materialeInfo = produktDiv.querySelector(".materiale-info");
      const produktGif = produktDiv.querySelector(".produkt-gif");

      if (produktValg) {
        materialeInfo.style.display = "block";
        produktGif.src = `produkter/${produktValg}.gif`;
        produktGif.style.display = "block";
      } else {
        materialeInfo.style.display = "none";
        produktGif.style.display = "none";
      }

      const produkt = priser[produktValg];
      if (!produkt) {
        console.error("Produkt ikke fundet:", produktValg);
        return;
      }

      const ppProcent = parseFloat(produktDiv.querySelector(".pp").value);
      const peProcent = parseFloat(produktDiv.querySelector(".pe").value);
      const metalProcent = parseFloat(produktDiv.querySelector(".metal").value);
      const glasProcent = parseFloat(produktDiv.querySelector(".glas").value) ;

      const totalVægt = produkt.vægt * antal;
      const prisPP = (ppProcent * bearbejdningsPriser.pp * totalVægt).toFixed(2);
      const prisPE = (peProcent * bearbejdningsPriser.pe * totalVægt).toFixed(2);
      const prisMetal = (metalProcent * bearbejdningsPriser.metal * totalVægt).toFixed(2);
      const prisGlas = (glasProcent * bearbejdningsPriser.glas * totalVægt).toFixed(2);
      const totalPris = (parseFloat(prisPP) + parseFloat(prisPE) + parseFloat(prisMetal) + parseFloat(prisGlas)).toFixed(2);

      produktDiv.querySelector(".pris-pp").value = prisPP;
      produktDiv.querySelector(".pris-pe").value = prisPE;
      produktDiv.querySelector(".pris-metal").value = prisMetal;
      produktDiv.querySelector(".pris-glas").value = prisGlas;

      samletPris += parseFloat(totalPris);
    });

    document.getElementById("samlet-pris").value = samletPris.toFixed(2);
  }
</script>
</body>
</html>
