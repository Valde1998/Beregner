<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Beregner</title>
  <link rel="stylesheet" href="style2.css">
</head>
<body>
<form>
  <label for="produkt-valg">Vælg produkt:</label>
  <select id="produkt-valg" onchange="opdaterVærdier()">
    <option value="">Vælg et produkt</option>
    <option value="pumpe">Pumpe</option>
    <option value="airless-dispenser">Airless dispenser</option>
    <option value="bambus">Bambus</option>
    <option value="creme-krukke">Creme krukke</option>
    <option value="creme-pumpe">Creme pumpe</option>
    <option value="deo-roll-on">Deo roll-on</option>
    <option value="emballage-sæt">Emballage sæt</option>
    <option value="glasemballage">Glasemballage</option>
    <option value="kapsler">Kapsler</option>
    <option value="lotion-pumpe">Lotion pumpe</option>
    <option value="make-up-emballage">Make-up emballage</option>
    <option value="make-up-fjerner-pumpe">Make-up fjerner pumpe</option>
    <option value="mist-sprayer">Mist sprayer</option>
    <option value="parfume-forstøver">Parfume forstøver</option>
    <option value="pet-flaske">PET flaske</option>
    <option value="pet-krukke">PET krukke</option>
    <option value="pharma-emballage">Pharma emballage</option>
    <option value="pipette-flaske">Pipette flaske</option>
    <option value="pp-pe-flaske">PP & PE flaske</option>
    <option value="premium-emballage">Premium emballage</option>
    <option value="skumpumpe">Skumpumpe</option>
    <option value="spande">Spande</option>
    <option value="sprayflaske">Sprayflaske</option>
    <option value="trigger-sprayer">Trigger sprayer</option>
    <option value="tube">Tube</option>
  </select>
  <br>
  <label for="antal">Antal:</label>
  <input type="number" id="antal" min="1" value="1" onchange="opdaterVærdier()" required>
  <br>
  <div id="materiale-info-pumpe" style="display: none;">
    <span>1 produkt = 10g</span><br>
    <span>PP: 73.02%</span><br>
    <span>PE: 15.07%</span><br>
    <span>Metal: 11.32%</span><br>
    <span>Glas: 0.58%</span>
  </div>
  <div id="materiale-info-airless-dispenser" style="display: none;">
    <span>1 produkt = 10g</span><br>
    <span>PP: 73.02%</span><br>
    <span>PE: 15.07%</span><br>
    <span>Metal: 11.32%</span><br>
    <span>Glas: 0.58%</span>
  </div>
  <div id="materiale-info-bambus" style="display: none;">
    <span>1 produkt = 20g</span><br>
    <span>PP: 60.00%</span><br>
    <span>PE: 20.00%</span><br>
    <span>Metal: 15.00%</span><br>
    <span>Glas: 5.00%</span>
  </div>
  <div id="materiale-info-creme-krukke" style="display: none;">
    <span>1 produkt = 30g</span><br>
    <span>PP: 50.00%</span><br>
    <span>PE: 25.00%</span><br>
    <span>Metal: 20.00%</span><br>
    <span>Glas: 5.00%</span>
  </div>
  <!-- Tilføj flere divs for de andre produkter her -->
  <br>
  <label for="vægt">Vægt (kg):</label>
  <input type="number" id="vægt" min="0" readonly>
  <br>
  <label for="pris-pp">Pris for PP (kr):</label>
  <input type="number" id="pris-pp" min="0" readonly>
  <br>
  <label for="pris-pe">Pris for PE (kr):</label>
  <input type="number" id="pris-pe" min="0" readonly>
  <br>
  <label for="pris-metal">Pris for Metal (kr):</label>
  <input type="number" id="pris-metal" min="0" readonly>
  <br>
  <label for="pris-glas">Pris for Glas (kr):</label>
  <input type="number" id="pris-glas" min="0" readonly>
  <br>
  <label for="pris">Samlet Pris (kr):</label>
  <input type="number" id="pris" min="0" readonly>
  <br><br>
</form>

<script>
  const priser = {
    pumpe: { vægt: 0.01, pp: 7.302, pe: 1.507, metal: 1.132, glas: 0.058},
    "airless-dispenser": { vægt: 0.01, pp: 7.302, pe: 1.507, metal: 1.132, glas: 0.058},
    bambus: { vægt: 0.02, pp: 60.00, pe: 20.00, metal: 15.00, glas: 5.00},
    "creme-krukke": { vægt: 0.03, pp: 50.00, pe: 25.00, metal: 20.00, glas: 5.00},
    // Tilføj flere produkter her
  };

  const bearbejdningsPriser = {
    pp: 0.004,
    pe: 0.004,
    metal: 0.001,
    glas: 0.002
  };

  function opdaterVærdier() {
    const produktValg = document.getElementById("produkt-valg").value;
    const antal = parseInt(document.getElementById("antal").value);
    const vægtInput = document.getElementById("vægt");
    const prisPPInput = document.getElementById("pris-pp");
    const prisPEInput = document.getElementById("pris-pe");
    const prisMetalInput = document.getElementById("pris-metal");
    const prisGlasInput = document.getElementById("pris-glas");
    const prisInput = document.getElementById("pris");

    // Skjul alle materiale-info divs
    document.querySelectorAll('[id^="materiale-info"]').forEach(div => div.style.display = "none");

    // Vis den relevante materiale-info div
    if (produktValg) {
      document.getElementById(`materiale-info-${produktValg}`).style.display = "block";
    }

    const produkt = priser[produktValg];

    vægtInput.value = (produkt.vægt * antal).toFixed(3);

    const prisPP = (produkt.pp * bearbejdningsPriser.pp * antal).toFixed(2);
    const prisPE = (produkt.pe * bearbejdningsPriser.pe * antal).toFixed(2);
    const prisMetal = (produkt.metal * bearbejdningsPriser.metal * antal).toFixed(2);
    const prisGlas = (produkt.glas * bearbejdningsPriser.glas * antal).toFixed(2);
    const totalPris = (parseFloat(prisPP) + parseFloat(prisPE) + parseFloat(prisMetal) + parseFloat(prisGlas)).toFixed(2);

    prisPPInput.value = prisPP;
    prisPEInput.value = prisPE;
    prisMetalInput.value = prisMetal;
    prisGlasInput.value = prisGlas;
    prisInput.value = totalPris;
  }
</script>
</body>
</html>
