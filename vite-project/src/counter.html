<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materiale Beregner</title>
</head>
<body>
<h1>Materiale Gebyr Beregner</h1>
<form id="beregner-form">
  <div id="materialer-container">
    <div class="materiale">
      <label for="materiale-1">Materiale_1:</label>
      <select class="materiale-type">
        <option value="PP">PP (Polypropylen)</option>
        <option value="PET">PET (Polyethylenterephthalat)</option>
        <option value="Glas">Glas</option>
        <option value="Metal">Metal</option>
      </select>
      <br>
      <label for="genanvendelighed-1">Genanvendelighed (%):</label>
      <input type="number" class="genanvendelighed" min="0" max="100" required>
      <br>
      <label for="vægt-1">Vægt (kg):</label>
      <input type="number" class="vægt" min="0" required>
      <br><br>
    </div>
  </div>
  <button type="button" onclick="tilføjMateriale()">Tilføj Materiale</button>
  <br><br>
  <button type="button" onclick="beregnGebyr()">Beregn</button>
</form>

<h2>Resultat:</h2>
<p id="resultat"></p>

<script>
  let materialeCount = 1;

  function tilføjMateriale() {
    materialeCount++;
    const container = document.getElementById("materialer-container");

    const materialeDiv = document.createElement("div");
    materialeDiv.classList.add("materiale");
    materialeDiv.innerHTML = `
        <label for="materiale-${materialeCount}">Materiale ${materialeCount}:</label>
        <select class="materiale-type">
          <option value="PP">PP (Polypropylen)</option>
          <option value="PET">PET (Polyethylenterephthalat)</option>
          <option value="Glas">Glas</option>
          <option value="Metal">Metal</option>
        </select>
        <br>
        <label for="genanvendelighed-${materialeCount}">Genanvendelighed (%):</label>
        <input type="number" class="genanvendelighed" min="0" max="100" required>
        <br>
        <label for="vægt-${materialeCount}">Vægt (kg):</label>
        <input type="number" class="vægt" min="0" required>
        <br><br>
      `;
    container.appendChild(materialeDiv);
  }

  function beregnGebyr() {
    const materialer = document.querySelectorAll(".materiale");
    let totalGenanvendelighed = 0;
    let totalVægt = 0;
    let totalGebyr = 0;

    materialer.forEach(materiale => {
      const genanvendelighed = parseFloat(materiale.querySelector(".genanvendelighed").value);
      const vægt = parseFloat(materiale.querySelector(".vægt").value);
      let gebyrPerKg = 0;

      // Bestem niveau og gebyr pr. kg
      if (genanvendelighed > 70) {
        gebyrPerKg = 1; // Grøn
      } else if (genanvendelighed >= 40) {
        gebyrPerKg = 5; // Gul
      } else {
        gebyrPerKg = 10; // Rød
      }

      totalGenanvendelighed += genanvendelighed * vægt;
      totalVægt += vægt;
      totalGebyr += vægt * gebyrPerKg;
    });

    const gennemsnitGenanvendelighed = totalGenanvendelighed / totalVægt;
    let samletNiveau = "";

    if (gennemsnitGenanvendelighed > 70) {
      samletNiveau = "Grøn";
    } else if (gennemsnitGenanvendelighed >= 40) {
      samletNiveau = "Gul";
    } else {
      samletNiveau = "Rød";
    }

    document.getElementById("resultat").innerText = `
        Produktet placeres i ${samletNiveau} niveau.
        Total vægt: ${totalVægt.toFixed(2)} kg.
        Total gebyr: ${totalGebyr.toFixed(2)} kr.
        Gennemsnitlig genanvendelighed: ${gennemsnitGenanvendelighed.toFixed(2)}%.
      `;
  }
</script>
</body>
</html>
